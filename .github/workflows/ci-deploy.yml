name: CI Build Deploy
on:
  push:
    branches: [ main ]

permissions:
  contents: read
  packages: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node for frontend build
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'

      - name: Install and build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Login to GHCR
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}:latest

      - name: Trigger remote deploy
        env:
          MITTWALD_TOKEN: ${{ secrets.MITTWALD_API_TOKEN }}
        run: |
          curl -v -X POST "https://p-ak2q3k.project.space/webhook-test/polischat-search" \
            -H "Content-Type: application/json" \
            -d '{"query":"test search","other":"value"}'

            
